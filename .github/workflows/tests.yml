name: Offline public core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,vault]'
      - run: duecare-eval verify
      - run: duecare-eval self-check
      - run: python tools/reproduce_findings.py --check
      - run: python tools/reproduce_comparisons.py --check
      - run: python tools/reproduce_indicator_followup.py --check
      - run: python tools/reproduce_jev_recovery.py --check
      - run: python tools/reproduce_longform.py --check
      - run: python tools/reproduce_longform_annotations.py --check
      - run: python tools/reproduce_source_completion.py --check
      - run: python tools/check_reference_bank.py
      - run: python tools/reproduce_longform_anchor_pilot.py --check
      - run: python tools/reproduce_jev_visuals.py --check
      - run: python tools/reproduce_matched_context.py --check
      - run: python tools/reproduce_matched_context_adapter.py --check
      - run: python tools/reproduce_structured_extraction.py --check
      - run: python tools/check_protection_harness.py --check
      - run: python tools/reproduce_context_scaffold.py --check
      - run: python tools/reproduce_model_expansion.py --check
      - run: python tools/check_breadth_design.py --check
      - run: python tools/prepare_narrative_indicators_v2.py --check
      - name: Validate industry packs and prepare offline harness inputs
        run: |
          for pack in agriculture construction manufacturing hospitality maritime platform_delivery; do
            python tools/check_extension_pack.py "examples/industry_packs/$pack" --plugin plugins/jev-typed.json
            python tools/check_extension_pack.py "examples/industry_packs/$pack" --plugin plugins/chat-messages.json --include-sources
            python tools/check_extension_pack.py "examples/industry_packs/$pack" --plugin plugins/jsonl-batch.json
          done
      - run: python -c 'from duecare_eval.case_exhibits import verify; print(verify("."))'
      - run: python -c 'from duecare_eval.call_accounting import summarize; print(summarize("."))'
      - run: duecare-eval report
      - run: python tools/check_grading_rubrics.py
      - run: duecare-eval doctor --json
      - run: sha256sum --check SHA256SUMS
      - run: pytest -q
