name: Offline public core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,vault]'
      - run: duecare-eval verify
      - run: duecare-eval self-check
      - run: python tools/reproduce_findings.py --check
      - run: python tools/reproduce_comparisons.py --check
      - run: python tools/reproduce_indicator_followup.py --check
      - run: python tools/reproduce_jev_recovery.py --check
      - run: python tools/check_grading_rubrics.py
      - run: duecare-eval doctor --json
      - run: sha256sum --check SHA256SUMS
      - run: pytest -q
